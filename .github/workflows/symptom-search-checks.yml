name: Symptom search safety checks

on:
  pull_request:
    paths:
      - "src/lib/clinical-reasoning.ts"
      - "src/lib/clinical-llm.ts"
      - "src/app/api/assistant/route.ts"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/symptom-search-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symptom-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
